<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cadastro · Condomínio San Marco</title>
<style>
  :root { --bg:#f5f4f0; --card:#fff; --ink:#1f1f1d; --muted:#6b6a65; --line:#dedbd3; --brand:#1f4e46; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif; background:var(--bg); color:var(--ink); padding:16px; }
  .card { width:100%; max-width:480px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:28px 22px; text-align:center; }
  .sobre { font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:0 0 6px; }
  h1 { font-size:22px; margin:0 0 14px; color:var(--brand); }
  p { font-size:15px; line-height:1.5; margin:0; color:var(--muted); }
</style>
</head>
<body>
  <main class="card">
    <p class="sobre">Condomínio San Marco</p>
    <h1>Formulário de cadastro</h1>
    <p>O formulário está sendo preparado e em breve estará disponível neste endereço.</p>
  </main>
</body>
</html>
